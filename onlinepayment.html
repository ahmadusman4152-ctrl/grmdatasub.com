4<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Online - G R M DATA SUB</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
  <section class="hero">

    <h1>G R M DATA SUB</h1>
    <p>Secure Online Payment</p>

    <div class="card">

      <h2>Fund Your Wallet</h2>

      <p>Enter the amount you want to test.</p>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount in Naira"
        min="100"
        required
      >

      <br><br>

      <button type="button" onclick="payWithPaystack()">
        Pay Now
      </button>

      <p id="message"></p>

    </div>

    <br>

    <p>
      <a href="payment.html">Back to Payment</a>
    </p>

    <p>
      <a href="dashboard.html">Back to Dashboard</a>
    </p>

  </section>
</main>

<script src="https://js.paystack.co/v2/inline.js"></script>

<script>

async function payWithPaystack() {

  const amount = Number(
    document.getElementById("amount").value
  );

  const message = document.getElementById("message");

  if (!amount || amount < 100) {
    message.textContent =
      "Please enter at least ₦100.";
    return;
  }

  const token =
    localStorage.getItem("grm_auth_token");

  const savedUser =
    localStorage.getItem("grm_user");

  if (!token || !savedUser) {
    message.textContent =
      "Please login first.";
    return;
  }

  const user = JSON.parse(savedUser);

  const email = user.email;

  if (!email) {
    message.textContent =
      "User email was not found.";
    return;
  }

  if (typeof PaystackPop === "undefined") {
  message.textContent =
    "Paystack library did not load. Please refresh the page and try again.";
  return;
}

const paystack = new PaystackPop();

  paystack.newTransaction({

    /*
      KEEP YOUR EXISTING PAYSTACK TEST PUBLIC KEY HERE.
      Do not use a secret key in this file.
    */
 key: "pk_test_bab420a74706defe3912e84c91d33abe930ba513",
    email: email,

    amount: amount * 100,

    currency: "NGN",

    onSuccess: async function(transaction) {

  message.textContent =
    "Payment received. Verifying transaction...";

  try {

    const response = await fetch(
      "https://api.grmdatasub.com/api/paystack/verify",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },

        body: JSON.stringify({
          reference: transaction.reference
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      message.textContent =
        data.message || "Payment verification failed.";
      return;
    }

    message.textContent =
      `Wallet funded successfully. ₦${Number(
        data.amount
      ).toFixed(2)} added.`;

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to verify payment. Please try again.";
  }

    },

    onCancel: function() {

      message.textContent =
        "Payment was cancelled.";

    },

    onError: function(error) {

      message.textContent =
        "Paystack Error: " +
        error.message;

    }

  });
}

</script>

</body>
</html>

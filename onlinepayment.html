
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Online - G R M DATA SUB</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<main>
  <section class="hero">

    <h1>G R M DATA SUB</h1>
    <p>Secure Online Payment</p>

    <div class="card">

      <h2>Fund Your Wallet</h2>

      <p>Enter the amount you want to test.</p>

      <input
        type="number"
        id="amount"
        placeholder="Enter amount in Naira"
        min="100"
        required
      >

      <br><br>

      <button type="button" onclick="payWithPaystack()">
        Pay Now
      </button>

    </div>

    <br>

    <p>
      <a href="payment.html">Back to Payment</a>
    </p>

    <p>
      <a href="dashboard.html">Back to Dashboard</a>
    </p>

  </section>
</main>

<script src="https://js.paystack.co/v2/inline.js"></script>

<script>
function payWithPaystack() {

  const amount = document.getElementById("amount").value;

  if (!amount || amount < 100) {
    alert("Please enter at least ₦100.");
    return;
  }

  const paystack = new PaystackPop();

  paystack.newTransaction({
    key: pk_test_bab420a74706defe3912e84c91d33abe930ba513 
    email: "customer@example.com",
    amount: Number(amount) * 100,
    currency: "NGN",

    onSuccess: function(transaction) {
      alert(
        "Payment successful! Reference: " +
        transaction.reference
      );
    },

    onCancel: function() {
      alert("Payment was cancelled.");
    }
  });
}
</script>

</body>
</html>

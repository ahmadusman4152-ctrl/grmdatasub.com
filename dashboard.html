* {

}

body {

.app-dashboard {

/* TOP HEADER */

.top-header {

}

.profile-area {

/* WALLET */

.wallet-balance {

.eye-button {

  background: #ffb000;

.commission {

}

.wallet-actions {
  display: flex;

  gap: 15px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.money-button {
  border: none;
  background: #ffb000;

/* SERVICES */

  padding: 20px;

.services-section h2 {
  font-size: 28px;
  margin-bottom: 25px;
}

.service-grid {

  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  width: 100%;
}

.service-card {

  background: #ffb000;

  font-size: 17px;

.service-icon {
  font-size: 25px;
  margin-bottom: 8px;
}

/* MESSAGE */

.message {

  margin: 20px;
  font-weight: bold;

/* BOTTOM NAVIGATION */

  display: grid;
  grid-template-columns: repeat(4, 1fr);

<script>

const API_URL = "https://api.grmdatasub.com";

const token = localStorage.getItem("grm_auth_token");

const userName = document.getElementById("userName");
const walletBalance = document.getElementById("walletBalance");
const balanceToggle = document.getElementById("balanceToggle");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logoutButton");


/* Check login */
async function loadAccount() {

  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/me`,
      {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      localStorage.removeItem("grm_auth_token");
      localStorage.removeItem("grm_user");

      window.location.href = "login.html";
      return;
    }

    userName.textContent =
  `Hello, ${data.user.fullName} 👋`;

const balance =
  Number(data.user.walletBalance || 0);

walletBalance.dataset.balance = balance;
walletBalance.textContent =
  `₦${balance.toFixed(2)}`;

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to connect to server. Please try again.";

  }
}
 
balanceToggle.addEventListener("click", function () {
  const isHidden = walletBalance.textContent.includes("••••");

  if (isHidden) {
    const balance = Number(walletBalance.dataset.balance || 0);
    walletBalance.textContent = `₦${balance.toFixed(2)}`;
  } else {
    walletBalance.textContent = "₦••••••";
  }
});

/* Logout */
logoutButton.addEventListener("click", async function () {

  try {

    await fetch(
      `${API_URL}/api/logout`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

  } catch (error) {

    console.error(error);

  }

  localStorage.removeItem("grm_auth_token");
  localStorage.removeItem("grm_user");

  window.location.href = "login.html";

});


async function viewTransactions() {
  if (!token) {
    window.location.href = "login.html";
    return;
  }

  const historySection = document.getElementById("transactionHistory");
  const transactionList = document.getElementById("transactionList");
  const receiptDetails = document.getElementById("receiptDetails");
  const receiptContent = document.getElementById("receiptContent");
  const printButton = document.getElementById("printReceipt");

  historySection.style.display = "block";
  transactionList.textContent = "Loading transaction history...";
  receiptDetails.style.display = "none";
  message.textContent = "";

  try {
    const response = await fetch(`${API_URL}/api/transactions`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${token}`
      }
    });

    const data = await response.json();

    if (!response.ok) {
      transactionList.textContent =
        data.message || "Unable to load transaction history.";
      return;
    }

    const transactions = Array.isArray(data.transactions)
      ? data.transactions
      : [];

    transactionList.replaceChildren();

    if (transactions.length === 0) {
      transactionList.textContent = "No transactions found.";
      return;
    }

    transactions.forEach((transaction, index) => {
      const card = document.createElement("div");
      card.style.cssText =
        "padding:14px;margin:12px 0;border:1px solid #ddd;border-radius:10px;";

      const amount = Number(transaction.amount || 0);
      const currency = transaction.currency || "NGN";
      const amountText =
        `${currency === "NGN" ? "₦" : currency + " "}` +
        amount.toLocaleString("en-NG", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      const date = transaction.created_at
        ? new Date(transaction.created_at)
        : null;

      const dateText =
        date && !Number.isNaN(date.getTime())
          ? date.toLocaleString()
          : "Date unavailable";

      const title = document.createElement("h3");
      title.textContent = `Transaction ${index + 1}`;

      const amountLine = document.createElement("p");
      amountLine.textContent = `Amount: ${amountText}`;

      const statusLine = document.createElement("p");
      statusLine.textContent =
        `Status: ${transaction.status || "Unknown"}`;

      const referenceLine = document.createElement("p");
      referenceLine.textContent =
        `Reference: ${transaction.reference || "N/A"}`;

      const dateLine = document.createElement("p");
      dateLine.textContent = `Date: ${dateText}`;

      const receiptButton = document.createElement("button");
      receiptButton.type = "button";
      receiptButton.textContent = "View Receipt";

      receiptButton.addEventListener("click", () => {
        receiptContent.replaceChildren();

        const receiptTitle = document.createElement("h3");
        receiptTitle.textContent = "G R M DATA SUB — Receipt";
        receiptContent.appendChild(receiptTitle);

        const details = [
          ["Transaction ID", transaction.id || "N/A"],
          ["Reference", transaction.reference || "N/A"],
          ["Amount", amountText],
          ["Currency", currency],
          ["Status", transaction.status || "Unknown"],
          ["Date", dateText]
        ];

        details.forEach(([label, value]) => {
          const line = document.createElement("p");
          const strong = document.createElement("strong");
          strong.textContent = `${label}: `;
          line.append(strong, document.createTextNode(String(value)));
          receiptContent.appendChild(line);
        });

        receiptDetails.style.display = "block";
        receiptDetails.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

        printButton.onclick = () => {
          const printWindow = window.open("", "_blank");

          if (!printWindow) {
            message.textContent =
              "Allow pop-ups to print or save the receipt.";
            return;
          }

          printWindow.document.write(`
            <!DOCTYPE html>
            <html>
              <head>
                <title>G R M DATA SUB Receipt</title>
                <style>
                  body {
                    font-family: Arial, sans-serif;
                    padding: 24px;
                    color: #222;
                  }
                  h3 { margin-bottom: 20px; }
                  p { padding: 8px 0; border-bottom: 1px solid #ddd; }
                </style>
              </head>
              <body>${receiptContent.innerHTML}</body>
            </html>
          `);

          printWindow.document.close();
          printWindow.focus();
          printWindow.print();
        };
        });

      card.append(
        title,
        amountLine,
        statusLine,
        referenceLine,
        dateLine,
        receiptButton
      );

      transactionList.appendChild(card);
    });
  } catch (error) {
    console.error("Transaction history error:", error);
    transactionList.textContent =
      "Unable to load transaction history. Please try again.";
  }
}

    
/* Start */
loadAccount();

</script>

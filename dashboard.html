<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - G R M DATA SUB</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .dashboard-user {
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .wallet-balance {
      font-size: 28px;
      font-weight: bold;
      margin: 12px 0 20px;
    }

    .logout-button {
      margin-top: 20px;
      background: #dc2626;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .message {
      margin: 15px 0;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="app-dashboard">

  <!-- TOP HEADER -->
  <header class="top-header">

    <div class="profile-area">
      <div class="profile-icon">👤</div>

      <div>
        <div class="welcome-small">Hi</div>
        <div class="profile-name" id="userName">
          Loading...
        </div>
        <div class="subscriber">Subscriber</div>
      </div>
    </div>

    <div class="header-icons">
      <button type="button" class="icon-button">⚙️</button>
      <button type="button" class="icon-button">🔔</button>
    </div>

  </header>


  <!-- WALLET SECTION -->
  <section class="wallet-section">

    <div class="wallet-title">
      Wallet Balance
    </div>

    <div class="wallet-row">
      <div class="wallet-balance" id="walletBalance">
        ₦0.00
      </div>

      <button type="button" class="eye-button">
        👁
      </button>
    </div>

    <div class="commission">
      Commission: <strong>₦0.00</strong>
    </div>

    <div class="wallet-actions">

      <a href="fundwallet.html" class="money-button">
        <span>＋</span>
        Add Money
      </a>

      <button type="button" class="money-button">
        <span>↓</span>
        Withdraw
      </button>

    </div>

  </section>


  <!-- SERVICES -->
  <section class="services-section">

    <h2>What Would You Like To Do Today?</h2>

    <div class="service-grid">

      <a href="buyairtime.html" class="service-card">
        <div class="service-icon">📞</div>
        <div>Airtime</div>
      </a>

      <a href="buydata.html" class="service-card">
        <div class="service-icon">📶</div>
        <div>Data</div>
      </a>

      <button type="button" class="service-card">
        <div class="service-icon">📺</div>
        <div>TV</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">⚡</div>
        <div>Electricity</div>
      </button>


      <button type="button" class="service-card">
        <div class="service-icon">🎫</div>
        <div>Exam Pin</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">🔄</div>
        <div>Airtime Swap</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">📱</div>
        <div>Airtime Pin</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">📡</div>
        <div>Data Pin</div>
      </button>


      <button type="button" class="service-card">
        <div class="service-icon">😊</div>
        <div>Smile</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">☎️</div>
        <div>Alpha</div>
      </button>

      <button type="button" class="service-card">
        <div class="service-icon">👥</div>
        <div>Referrals</div>
      </button>

      <button
        type="button"
        class="service-card"
        id="logoutButton"
      >
        <div class="service-icon">🚪</div>
        <div>Logout</div>
      </button>

    </div>

  </section>


  <!-- MESSAGE -->
  <p class="message" id="message"></p>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <a href="dashboard.html" class="bottom-item active">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <button type="button" class="bottom-item">
      <span>☰</span>
      <small>History</small>
    </button>

    <a href="fundwallet.html" class="plus-button">
      ＋
    </a>

    <button type="button" class="bottom-item">
      <span>👤</span>
      <small>Profile</small>
    </button>

    <button type="button" class="bottom-item">
      <span>✉️</span>
      <small>Support</small>
    </button>

  </nav>

</div>

<script>

const API_URL = "https://api.grmdatasub.com";

const token = localStorage.getItem("grm_auth_token");

const userName = document.getElementById("userName");
const walletBalance = document.getElementById("walletBalance");
const message = document.getElementById("message");
const logoutButton = document.getElementById("logoutButton");


/* Check login */
async function loadAccount() {

  if (!token) {
    window.location.href = "login.html";
    return;
  }

  try {

    const response = await fetch(
      `${API_URL}/api/me`,
      {
        method: "GET",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {

      localStorage.removeItem("grm_auth_token");
      localStorage.removeItem("grm_user");

      window.location.href = "login.html";
      return;
    }

    userName.textContent =
      `Hello, ${data.user.fullName} 👋`;

    const balance =
      Number(data.user.walletBalance || 0);

    walletBalance.textContent =
      `₦${balance.toFixed(2)}`;

  } catch (error) {

    console.error(error);

    message.textContent =
      "Unable to connect to server. Please try again.";

  }
}


/* Logout */
logoutButton.addEventListener("click", async function () {

  try {

    await fetch(
      `${API_URL}/api/logout`,
      {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${token}`
        }
      }
    );

  } catch (error) {

    console.error(error);

  }

  localStorage.removeItem("grm_auth_token");
  localStorage.removeItem("grm_user");

  window.location.href = "login.html";

});


/* Transactions */
function viewTransactions() {

  message.textContent =
    "Transaction history will be available here.";

}


/* Start */
loadAccount();

</script>

</body>
</html>

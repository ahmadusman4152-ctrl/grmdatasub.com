<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buy Airtime - G R M DATA SUB</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .airtime-card {
            max-width: 520px;
            margin: 30px auto;
        }

        .summary {
            display: none;
            margin-top: 25px;
            padding: 22px;
            border-radius: 18px;
            background: #f5f7fa;
            text-align: left;
        }

        .summary h3 {
            color: #1266d6;
            text-align: center;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #ddd;
        }

        .summary-row:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-weight: bold;
        }

        .confirm-button {
            width: 100%;
            margin-top: 18px;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-button {
            width: 100%;
            margin-top: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

<main>

<section class="hero airtime-card">

    <h1>G R M DATA SUB</h1>

    <h2>Buy Airtime 📱</h2>

    <p>
        Buy airtime quickly and easily for any Nigerian network.
    </p>

    <form id="airtimeForm">

        <select id="network" required>
            <option value="">Select Network</option>
            <option value="MTN">MTN</option>
            <option value="Airtel">Airtel</option>
            <option value="Glo">Glo</option>
            <option value="9mobile">9mobile</option>
        </select>

        <br><br>

        <input
            type="tel"
            id="phone"
            placeholder="Enter phone number"
            maxlength="11"
            required
        >

        <br><br>

        <input
            type="number"
            id="amount"
            placeholder="Enter amount (₦)"
            min="50"
            required
        >

        <br><br>

        <button type="submit">
            Continue
        </button>

    </form>


    <!-- Order Summary -->

    <div class="summary" id="summary">

        <h3>Confirm Airtime Order</h3>

        <div class="summary-row">
            <span class="summary-label">Network</span>
            <span id="summaryNetwork"></span>
        </div>

        <div class="summary-row">
            <span class="summary-label">Phone Number</span>
            <span id="summaryPhone"></span>
        </div>

        <div class="summary-row">
            <span class="summary-label">Amount</span>
            <span id="summaryAmount"></span>
        </div>

        <button
            type="button"
            class="confirm-button"
            id="confirmButton">
            Confirm Order
        </button>

        <button
            type="button"
            class="cancel-button"
            id="cancelButton">
            Cancel
        </button>

    </div>


    <p
        class="message"
        id="message">
    </p>


    <p>
        <a href="dashboard.html">
            ← Back to Dashboard
        </a>
    </p>

</section>

</main>


<script>

const airtimeForm = document.getElementById("airtimeForm");

const summary = document.getElementById("summary");

const message = document.getElementById("message");

const confirmButton =
    document.getElementById("confirmButton");

const cancelButton =
    document.getElementById("cancelButton");


airtimeForm.addEventListener("submit", function(event) {

    event.preventDefault();

    const network =
        document.getElementById("network").value;

    const phone =
        document.getElementById("phone").value.trim();

    const amount =
        Number(document.getElementById("amount").value);


    if (!network) {
        message.textContent =
            "Please select a network.";

        return;
    }


    if (!/^0\d{10}$/.test(phone)) {

        message.textContent =
            "Please enter a valid 11-digit phone number.";

        return;
    }


    if (!amount || amount < 50) {

        message.textContent =
            "Minimum airtime amount is ₦50.";

        return;
    }


    document.getElementById("summaryNetwork")
        .textContent = network;

    document.getElementById("summaryPhone")
        .textContent = phone;

    document.getElementById("summaryAmount")
        .textContent =
        "₦" + amount.toLocaleString();


    summary.style.display = "block";

    message.textContent = "";

});


confirmButton.addEventListener("click", function() {

    message.textContent =
        "Order confirmation is ready. Airtime processing will be connected after the backend and authorized airtime provider are configured.";

});


cancelButton.addEventListener("click", function() {

    summary.style.display = "none";

    message.textContent = "";

});


</script>

</body>
</html>
